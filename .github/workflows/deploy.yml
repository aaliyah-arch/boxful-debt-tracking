name: Build Apps Script page

# 不再部署到 GitHub Pages：改為打包成單一 index.html，貼進 Google Apps Script 使用
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install client dependencies
        run: |
          cd client
          npm ci

      - name: Build single-file page for Apps Script
        run: |
          cd client
          npm run build:gas

      - name: Upload index.html
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-index-html
          path: client/dist-gas/index.html
          retention-days: 30
